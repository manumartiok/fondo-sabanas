<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fondo Sábanas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f5f1;--ink:#2b2724;--muted:#8a827a;--line:#e4dfd8;--card:#fff;--accent:#b88a6a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}
  header{text-align:center;padding:48px 16px 24px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,6vw,52px);margin:0;letter-spacing:.5px}
  h1 em{color:var(--accent)}
  header p{color:var(--muted);margin:8px 0 0;font-size:15px}
  main{max-width:1100px;margin:0 auto;padding:0 16px 64px}
  #drop{display:block;border:1.5px dashed #cfc7bd;border-radius:18px;background:var(--card);padding:44px 20px;text-align:center;cursor:pointer;transition:.2s}
  #drop:hover,#drop.over{border-color:var(--accent);background:#fffaf6}
  #drop strong{display:block;font-size:17px;font-weight:500;margin-bottom:6px}
  #drop span{color:var(--muted);font-size:14px}
  #drop svg{width:40px;height:40px;stroke:var(--accent);margin-bottom:10px}
  .bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:24px 0 16px}
  #status{color:var(--muted);font-size:14px}
  button{font:inherit;font-size:14px;font-weight:500;border:0;border-radius:999px;padding:11px 22px;cursor:pointer;background:var(--ink);color:#fff;transition:.15s}
  button:hover{opacity:.85}
  button:disabled{opacity:.35;cursor:default}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .thumb{aspect-ratio:3/4;background:#efebe5 center/cover no-repeat;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .state{position:absolute;inset:0;display:grid;place-items:center;background:rgba(247,245,241,.75);font-size:13px;color:var(--muted);backdrop-filter:blur(2px)}
  .spin{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 8px}
  @keyframes s{to{transform:rotate(360deg)}}
  .meta{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .meta small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta a{font-size:13px;font-weight:500;color:var(--accent);text-decoration:none;white-space:nowrap}
  .err{color:#b4483a}
  .opt{font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .opt input{accent-color:var(--accent);width:15px;height:15px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding-bottom:32px}
</style>
</head>
<body>
<header>
  <h1>Fondo <em>Sábanas</em></h1>
  <p>Subí tus fotos y descargalas sobre sábanas blancas, en calidad original.</p>
</header>
<main>
  <label id="drop">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <strong>Arrastrá las fotos acá, hacé click o pegalas con Ctrl+V</strong>
    <span>JPG, PNG o WEBP · todas las que quieras</span>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </label>

  <div class="bar">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div id="status">La primera vez tarda un poco más (descarga el modelo).</div>
      <label class="opt"><input type="checkbox" id="lace" checked> Prendas transparentes / encaje</label>
    </div>
    <div style="display:flex;gap:8px">
      <button class="ghost" id="clear" disabled>Limpiar</button>
      <button id="zip" disabled>Descargar todas (.zip)</button>
    </div>
  </div>

  <div id="grid"></div>
</main>
<footer>Todo se procesa en tu navegador · las fotos no se suben a ningún servidor</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";

const $ = s => document.querySelector(s);
const drop = $('#drop'), input = $('#file'), grid = $('#grid'), status = $('#status');
const results = []; // {name, blob}
const queue = [];
let busy = false, total = 0, done = 0;

const bgImg = new Image();
bgImg.src = 'sabanas.jpg';
const bgReady = bgImg.decode();

input.onchange = e => { addFiles(e.target.files); input.value = ''; };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
// Pegar imágenes con Ctrl+V (capturas, imágenes copiadas de WhatsApp, del navegador, etc.)
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.items || [])]
    .filter(it => it.kind === 'file' && it.type.startsWith('image/'))
    .map((it, i) => {
      const f = it.getAsFile();
      const ext = (f.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
      return new File([f], f.name && f.name !== 'image.png' ? f.name : `pegada_${Date.now()}_${i}.${ext}`, { type: f.type });
    });
  if (files.length) { e.preventDefault(); addFiles(files); }
});

function addFiles(files){
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<div class="thumb" style="background-image:url(${URL.createObjectURL(f)})"><div class="state"><div><div class="spin"></div>En espera…</div></div></div>
      <div class="meta"><small>${f.name}</small><span></span></div>`;
    grid.prepend(el);
    queue.push({ file: f, el });
    total++;
  }
  $('#clear').disabled = false;
  updateStatus();
  run();
}

function updateStatus(){
  status.textContent = total ? `Listas ${done} de ${total}` : 'La primera vez tarda un poco más (descarga el modelo).';
  $('#zip').disabled = results.length === 0;
}

async function run(){
  if (busy) return;
  busy = true;
  while (queue.length){
    const { file, el } = queue.shift();
    const state = el.querySelector('.state');
    state.innerHTML = '<div><div class="spin"></div>Procesando…</div>';
    try {
      const blob = await process(file, p => state.innerHTML = `<div><div class="spin"></div>${p}</div>`);
      const name = file.name.replace(/\.[^.]+$/, '') + '_sabanas.jpg';
      results.push({ name, blob });
      const url = URL.createObjectURL(blob);
      el.querySelector('.thumb').innerHTML = `<img src="${url}" alt="">`;
      el.querySelector('.meta span').innerHTML = `<a href="${url}" download="${name}">Descargar</a>`;
    } catch (err) {
      console.error(err);
      state.innerHTML = '<div class="err">Error al procesar</div>';
    }
    done++;
    updateStatus();
  }
  busy = false;
}

async function process(file, onProgress){
  const cut = await removeBackground(file, {
    model: 'isnet',
    output: { format: 'image/png', quality: 1 },
    progress: (key, cur, tot) => {
      if (key.startsWith('fetch')) onProgress(`Descargando modelo ${Math.round(cur / tot * 100)}%`);
      else onProgress('Procesando…');
    }
  });
  await bgReady;
  let fg = await createImageBitmap(cut);
  if ($('#lace').checked) fg = await refineTransparency(file, fg);
  const W = fg.width, H = fg.height;

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  // Fondo: sábanas en modo "cover", rotado si la foto es horizontal
  const landscape = W > H;
  ctx.save();
  if (landscape){ ctx.translate(W, 0); ctx.rotate(Math.PI / 2); }
  const cw = landscape ? H : W, ch = landscape ? W : H;
  const s = Math.max(cw / bgImg.width, ch / bgImg.height);
  const bw = bgImg.width * s, bh = bgImg.height * s;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bgImg, (cw - bw) / 2, (ch - bh) / 2, bw, bh);
  ctx.restore();

  // Sombra suave de contacto
  const k = Math.max(W, H) / 1000;
  const sh = document.createElement('canvas');
  sh.width = W; sh.height = H;
  const sctx = sh.getContext('2d');
  sctx.drawImage(fg, 0, 0);
  sctx.globalCompositeOperation = 'source-in';
  sctx.fillStyle = '#6b6258';
  sctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.filter = `blur(${6 * k}px)`;
  ctx.drawImage(sh, 3 * k, 5 * k);
  ctx.globalAlpha = 0.18;
  ctx.filter = `blur(${1.5 * k}px)`;
  ctx.drawImage(sh, 0.8 * k, 1.2 * k);
  ctx.restore();

  ctx.drawImage(fg, 0, 0);
  fg.close?.();

  return await new Promise(r => c.toBlob(r, 'image/jpeg', 1));
}

// Encaje / telas transparentes: recorte por diferencia de color contra el fondo original,
// combinado con la máscara de la IA. Lo que se parece al fondo dentro de la prenda queda transparente.
async function refineTransparency(file, fg){
  const W = fg.width, H = fg.height, N = W * H;
  let orig = await createImageBitmap(file, { imageOrientation: 'from-image' });
  if (orig.width !== W || orig.height !== H) { orig.close?.(); orig = await createImageBitmap(file, { imageOrientation: 'none' }); }
  if (orig.width !== W || orig.height !== H) return fg;

  const c = new OffscreenCanvas(W, H), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(orig, 0, 0); const O = x.getImageData(0, 0, W, H).data;
  x.clearRect(0, 0, W, H); x.drawImage(fg, 0, 0); const out = x.getImageData(0, 0, W, H); const P = out.data;

  // 1) Color del fondo: mediana del borde de la foto
  const bw = Math.max(2, Math.round(Math.min(W, H) * 0.03));
  const hr = new Uint32Array(256), hg = new Uint32Array(256), hb = new Uint32Array(256); let n = 0;
  for (let y = 0; y < H; y += 2) for (let xx = 0; xx < W; xx += 2) {
    if (y >= bw && y < H - bw && xx >= bw && xx < W - bw) continue;
    const i = (y * W + xx) * 4; hr[O[i]]++; hg[O[i + 1]]++; hb[O[i + 2]]++; n++;
  }
  const med = h => { let a = 0; for (let v = 0; v < 256; v++) { a += h[v]; if (a >= n / 2) return v; } return 0; };
  const B = [med(hr), med(hg), med(hb)];
  const dist = (r, g, b) => Math.sqrt((r - B[0]) ** 2 + (g - B[1]) ** 2 + (b - B[2]) ** 2);

  // 2) Región de la prenda en baja resolución (Otsu + apertura + relleno de huecos)
  const sc = Math.min(1, 800 / Math.max(W, H)), w = Math.round(W * sc), h = Math.round(H * sc), M = w * h;
  const sc2 = new OffscreenCanvas(w, h), sx = sc2.getContext('2d', { willReadFrequently: true });
  sx.drawImage(orig, 0, 0, w, h); const S = sx.getImageData(0, 0, w, h).data;
  sx.clearRect(0, 0, w, h); sx.drawImage(fg, 0, 0, w, h); const SM = sx.getImageData(0, 0, w, h).data;
  const ds = new Float32Array(M), hist = new Float64Array(443);
  for (let j = 0; j < M; j++) { const d = dist(S[j * 4], S[j * 4 + 1], S[j * 4 + 2]); ds[j] = d; hist[Math.min(442, d | 0)]++; }
  let sum = 0; for (let t = 0; t < 443; t++) sum += t * hist[t];
  let wB = 0, sB = 0, best = 0, T = 0;
  for (let t = 0; t < 443; t++) {
    wB += hist[t]; if (!wB) continue; const wF = M - wB; if (!wF) break;
    sB += t * hist[t]; const v = wB * wF * (sB / wB - (sum - sB) / wF) ** 2; if (v > best) { best = v; T = t; }
  }
  let bin = new Uint8Array(M);
  for (let j = 0; j < M; j++) bin[j] = (ds[j] > T || SM[j * 4 + 3] > 200) ? 1 : 0;
  const morph = (src, r, dilate) => { // min/max separable en cuadrado
    const tmp = new Uint8Array(M), dst = new Uint8Array(M);
    for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
      let v = dilate ? 0 : 1;
      for (let k = Math.max(0, xx - r); k <= Math.min(w - 1, xx + r); k++) { const s = src[y * w + k]; if (dilate ? s : !s) { v = dilate ? 1 : 0; break; } }
      tmp[y * w + xx] = v;
    }
    for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
      let v = dilate ? 0 : 1;
      for (let k = Math.max(0, y - r); k <= Math.min(h - 1, y + r); k++) { const s = tmp[k * w + xx]; if (dilate ? s : !s) { v = dilate ? 1 : 0; break; } }
      dst[y * w + xx] = v;
    }
    return dst;
  };
  bin = morph(morph(bin, 1, false), 1, true);
  // flood fill del fondo desde los bordes: lo no alcanzado es la prenda (con huecos rellenos)
  const bgc = new Uint8Array(M), q = new Int32Array(M); let qh = 0, qt = 0;
  const push = j => { if (!bin[j] && !bgc[j]) { bgc[j] = 1; q[qt++] = j; } };
  for (let xx = 0; xx < w; xx++) { push(xx); push((h - 1) * w + xx); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  while (qh < qt) {
    const j = q[qh++], xx = j % w;
    if (xx > 0) push(j - 1); if (xx < w - 1) push(j + 1); if (j >= w) push(j - w); if (j < M - w) push(j + w);
  }
  let region = new Uint8Array(M); for (let j = 0; j < M; j++) region[j] = bgc[j] ? 0 : 1;
  region = morph(region, 3, true);

  // Quedarse solo con la prenda (componente principal), descartando objetos sueltos en los bordes
  {
    const lab = new Int32Array(M); let nl = 0; const areas = [0];
    for (let j0 = 0; j0 < M; j0++) {
      if (!region[j0] || lab[j0]) continue;
      nl++; let a = 0; qh = qt = 0; q[qt++] = j0; lab[j0] = nl;
      while (qh < qt) {
        const j = q[qh++], xx = j % w; a++;
        if (xx > 0 && region[j - 1] && !lab[j - 1]) { lab[j - 1] = nl; q[qt++] = j - 1; }
        if (xx < w - 1 && region[j + 1] && !lab[j + 1]) { lab[j + 1] = nl; q[qt++] = j + 1; }
        if (j >= w && region[j - w] && !lab[j - w]) { lab[j - w] = nl; q[qt++] = j - w; }
        if (j < M - w && region[j + w] && !lab[j + w]) { lab[j + w] = nl; q[qt++] = j + w; }
      }
      areas.push(a);
    }
    const maxA = Math.max(...areas);
    for (let j = 0; j < M; j++) if (region[j] && areas[lab[j]] < maxA * 0.15) region[j] = 0;
  }

  // Partes oscuras pegadas a la prenda (broches, elásticos negros): se conservan opacas
  const lumB = 0.299 * B[0] + 0.587 * B[1] + 0.114 * B[2];
  const darkThr = lumB * 0.85;
  const lumS = j => 0.299 * S[j * 4] + 0.587 * S[j * 4 + 1] + 0.114 * S[j * 4 + 2];
  let darkS = new Uint8Array(M);
  const nearGarment = morph(region, 6, true);
  for (let j = 0; j < M; j++) if (lumS(j) < lumB * 0.4) darkS[j] = 1;
  darkS = morph(morph(darkS, 1, false), 1, true);       // quitar granitos del piso
  { // descartar manchas oscuras chicas
    const seen = new Uint8Array(M), minA = M * 0.0004;
    for (let j0 = 0; j0 < M; j0++) {
      if (!darkS[j0] || seen[j0]) continue;
      qh = qt = 0; q[qt++] = j0; seen[j0] = 1;
      while (qh < qt) {
        const j = q[qh++], xx = j % w;
        for (const nb of [xx > 0 ? j - 1 : -1, xx < w - 1 ? j + 1 : -1, j >= w ? j - w : -1, j < M - w ? j + w : -1])
          if (nb >= 0 && darkS[nb] && !seen[nb]) { seen[nb] = 1; q[qt++] = nb; }
      }
      let touches = false; for (let t = 0; t < qt && !touches; t++) if (nearGarment[q[t]]) touches = true;
      if (qt < minA || !touches) for (let t = 0; t < qt; t++) darkS[q[t]] = 0;
    }
  }
  const darkGate = morph(darkS, 2, true);
  for (let j = 0; j < M; j++) if (darkGate[j]) region[j] = 1;

  // 3) Escalar la región a tamaño completo (suavizada)
  const gi = sx.createImageData(w, h);
  for (let j = 0; j < M; j++) { gi.data[j * 4 + 3] = region[j] * 255; }
  sx.clearRect(0, 0, w, h); sx.putImageData(gi, 0, 0);
  x.clearRect(0, 0, W, H); x.imageSmoothingQuality = 'high'; x.drawImage(sc2, 0, 0, W, H);
  const G = x.getImageData(0, 0, W, H).data;
  const dg = sx.createImageData(w, h);
  for (let j = 0; j < M; j++) { dg.data[j * 4 + 3] = darkGate[j] * 255; }
  sx.clearRect(0, 0, w, h); sx.putImageData(dg, 0, 0);
  x.clearRect(0, 0, W, H); x.drawImage(sc2, 0, 0, W, H);
  const DG = x.getImageData(0, 0, W, H).data;

  // 4) Umbrales de opacidad
  const hIn = new Uint32Array(443), hOut = new Uint32Array(443); let nIn = 0, nOut = 0;
  for (let i = 0; i < N * 4; i += 4 * 5) {
    const d = Math.min(442, dist(O[i], O[i + 1], O[i + 2]) | 0);
    if (G[i + 3] > 250) { hIn[d]++; nIn++; } else if (G[i + 3] === 0) { hOut[d]++; nOut++; }
  }
  const pct = (hh, tot, p) => { let a = 0; for (let v = 0; v < 443; v++) { a += hh[v]; if (a >= tot * p) return v; } return 442; };
  if (nIn < 200) return fg;
  let t1 = pct(hIn, nIn, 0.97);
  const t0 = Math.max(t1 * 0.15, nOut ? pct(hOut, nOut, 0.97) : 0);
  t1 = Math.max(t1, t0 + 30);

  // 5) Alfa final. Las partes opacas quedan con el píxel original intacto;
  //    en los hilos semitransparentes solo se quita el fondo del brillo, conservando el tono original.
  for (let i = 0; i < N * 4; i += 4) {
    const g = G[i + 3] / 255;
    const r = O[i], gg = O[i + 1], b = O[i + 2];
    const lum = 0.299 * r + 0.587 * gg + 0.114 * b;
    const dgv = DG[i + 3] / 255;
    if (dgv > 0) {                                   // broches / partes negras
      const da = dgv * Math.min(1, Math.max(0, (darkThr - lum) / (darkThr - lumB * 0.45)));
      if (da > 0) { P[i] = r; P[i + 1] = gg; P[i + 2] = b; P[i + 3] = 255 * da; continue; }
    }
    if (!g) { P[i + 3] = 0; continue; }
    const ca = Math.min(1, Math.max(0, (dist(r, gg, b) - t0) / (t1 - t0)));
    const ma = P[i + 3] / 255;
    P[i] = r; P[i + 1] = gg; P[i + 2] = b;
    if (ca < 0.999 && ca >= ma && ca > 0.004 && lum > 1) {
      const lu = lumB + (lum - lumB) / ca;
      let f = Math.max(1, lu / lum);
      const mx = Math.max(r, gg, b) * f; if (mx > 255) f *= 255 / mx;
      P[i] = r * f; P[i + 1] = gg * f; P[i + 2] = b * f;
    }
    P[i + 3] = 255 * g * Math.max(ca, ma);
  }
  x.clearRect(0, 0, W, H); x.putImageData(out, 0, 0);
  orig.close?.(); fg.close?.();
  return c.transferToImageBitmap();
}

$('#zip').onclick = async () => {
  const btn = $('#zip'); btn.disabled = true; btn.textContent = 'Armando zip…';
  const zip = new JSZip();
  const used = {};
  for (const { name, blob } of results){
    let n = name; if (used[n]) n = n.replace('.jpg', `_${used[n]}.jpg`); used[name] = (used[name] || 0) + 1;
    zip.file(n, blob);
  }
  const out = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out); a.download = 'fotos_sabanas.zip'; a.click();
  btn.textContent = 'Descargar todas (.zip)'; btn.disabled = false;
};

$('#clear').onclick = () => {
  if (busy) queue.length = 0;
  grid.innerHTML = ''; results.length = 0; total = done = 0;
  $('#clear').disabled = true; updateStatus();
};
</script>
</body>
</html>
