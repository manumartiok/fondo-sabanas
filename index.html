<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fondo Sábanas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f5f1;--ink:#2b2724;--muted:#8a827a;--line:#e4dfd8;--card:#fff;--accent:#b88a6a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}
  header{text-align:center;padding:48px 16px 24px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(34px,6vw,52px);margin:0;letter-spacing:.5px}
  h1 em{color:var(--accent)}
  header p{color:var(--muted);margin:8px 0 0;font-size:15px}
  main{max-width:1100px;margin:0 auto;padding:0 16px 64px}
  #drop{border:1.5px dashed #cfc7bd;border-radius:18px;background:var(--card);padding:44px 20px;text-align:center;cursor:pointer;transition:.2s}
  #drop:hover,#drop.over{border-color:var(--accent);background:#fffaf6}
  #drop strong{display:block;font-size:17px;font-weight:500;margin-bottom:6px}
  #drop span{color:var(--muted);font-size:14px}
  #drop svg{width:40px;height:40px;stroke:var(--accent);margin-bottom:10px}
  .bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:24px 0 16px}
  #status{color:var(--muted);font-size:14px}
  button{font:inherit;font-size:14px;font-weight:500;border:0;border-radius:999px;padding:11px 22px;cursor:pointer;background:var(--ink);color:#fff;transition:.15s}
  button:hover{opacity:.85}
  button:disabled{opacity:.35;cursor:default}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .thumb{aspect-ratio:3/4;background:#efebe5 center/cover no-repeat;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .state{position:absolute;inset:0;display:grid;place-items:center;background:rgba(247,245,241,.75);font-size:13px;color:var(--muted);backdrop-filter:blur(2px)}
  .spin{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 8px}
  @keyframes s{to{transform:rotate(360deg)}}
  .meta{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .meta small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta a{font-size:13px;font-weight:500;color:var(--accent);text-decoration:none;white-space:nowrap}
  .err{color:#b4483a}
  .opt{font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .opt input{accent-color:var(--accent);width:15px;height:15px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding-bottom:32px}
</style>
</head>
<body>
<header>
  <h1>Fondo <em>Sábanas</em></h1>
  <p>Subí tus fotos y descargalas sobre sábanas blancas, en calidad original.</p>
</header>
<main>
  <label id="drop">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    <strong>Arrastrá las fotos acá o hacé click</strong>
    <span>JPG, PNG o WEBP · todas las que quieras</span>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </label>

  <div class="bar">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div id="status">La primera vez tarda un poco más (descarga el modelo).</div>
      <label class="opt"><input type="checkbox" id="lace" checked> Prendas transparentes / encaje</label>
    </div>
    <div style="display:flex;gap:8px">
      <button class="ghost" id="clear" disabled>Limpiar</button>
      <button id="zip" disabled>Descargar todas (.zip)</button>
    </div>
  </div>

  <div id="grid"></div>
</main>
<footer>Todo se procesa en tu navegador · las fotos no se suben a ningún servidor</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";

const $ = s => document.querySelector(s);
const drop = $('#drop'), input = $('#file'), grid = $('#grid'), status = $('#status');
const results = []; // {name, blob}
const queue = [];
let busy = false, total = 0, done = 0;

const bgImg = new Image();
bgImg.src = 'sabanas.jpg';
const bgReady = bgImg.decode();

input.onchange = e => { addFiles(e.target.files); input.value = ''; };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

function addFiles(files){
  for (const f of files){
    if (!f.type.startsWith('image/')) continue;
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<div class="thumb" style="background-image:url(${URL.createObjectURL(f)})"><div class="state"><div><div class="spin"></div>En espera…</div></div></div>
      <div class="meta"><small>${f.name}</small><span></span></div>`;
    grid.prepend(el);
    queue.push({ file: f, el });
    total++;
  }
  $('#clear').disabled = false;
  updateStatus();
  run();
}

function updateStatus(){
  status.textContent = total ? `Listas ${done} de ${total}` : 'La primera vez tarda un poco más (descarga el modelo).';
  $('#zip').disabled = results.length === 0;
}

async function run(){
  if (busy) return;
  busy = true;
  while (queue.length){
    const { file, el } = queue.shift();
    const state = el.querySelector('.state');
    state.innerHTML = '<div><div class="spin"></div>Procesando…</div>';
    try {
      const blob = await process(file, p => state.innerHTML = `<div><div class="spin"></div>${p}</div>`);
      const name = file.name.replace(/\.[^.]+$/, '') + '_sabanas.jpg';
      results.push({ name, blob });
      const url = URL.createObjectURL(blob);
      el.querySelector('.thumb').innerHTML = `<img src="${url}" alt="">`;
      el.querySelector('.meta span').innerHTML = `<a href="${url}" download="${name}">Descargar</a>`;
    } catch (err) {
      console.error(err);
      state.innerHTML = '<div class="err">Error al procesar</div>';
    }
    done++;
    updateStatus();
  }
  busy = false;
}

async function process(file, onProgress){
  const cut = await removeBackground(file, {
    model: 'isnet',
    output: { format: 'image/png', quality: 1 },
    progress: (key, cur, tot) => {
      if (key.startsWith('fetch')) onProgress(`Descargando modelo ${Math.round(cur / tot * 100)}%`);
      else onProgress('Procesando…');
    }
  });
  await bgReady;
  let fg = await createImageBitmap(cut);
  if ($('#lace').checked) fg = await refineTransparency(file, fg);
  const W = fg.width, H = fg.height;

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  // Fondo: sábanas en modo "cover", rotado si la foto es horizontal
  const landscape = W > H;
  ctx.save();
  if (landscape){ ctx.translate(W, 0); ctx.rotate(Math.PI / 2); }
  const cw = landscape ? H : W, ch = landscape ? W : H;
  const s = Math.max(cw / bgImg.width, ch / bgImg.height);
  const bw = bgImg.width * s, bh = bgImg.height * s;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bgImg, (cw - bw) / 2, (ch - bh) / 2, bw, bh);
  ctx.restore();

  // Sombra suave de contacto
  const k = Math.max(W, H) / 1000;
  const sh = document.createElement('canvas');
  sh.width = W; sh.height = H;
  const sctx = sh.getContext('2d');
  sctx.drawImage(fg, 0, 0);
  sctx.globalCompositeOperation = 'source-in';
  sctx.fillStyle = '#6b6258';
  sctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.filter = `blur(${6 * k}px)`;
  ctx.drawImage(sh, 3 * k, 5 * k);
  ctx.globalAlpha = 0.18;
  ctx.filter = `blur(${1.5 * k}px)`;
  ctx.drawImage(sh, 0.8 * k, 1.2 * k);
  ctx.restore();

  ctx.drawImage(fg, 0, 0);
  fg.close?.();

  return await new Promise(r => c.toBlob(r, 'image/jpeg', 1));
}

// Encaje / telas transparentes: lo que dentro de la prenda tiene el color del fondo original
// se vuelve transparente, y se "desmezcla" el color para quitar el tinte del fondo.
async function refineTransparency(file, fg){
  const W = fg.width, H = fg.height;
  const c = new OffscreenCanvas(W, H), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(fg, 0, 0);
  const fd = x.getImageData(0, 0, W, H), p = fd.data;
  let orig = await createImageBitmap(file, { imageOrientation: 'from-image' });
  if (orig.width !== W) { orig.close?.(); orig = await createImageBitmap(file, { imageOrientation: 'none' }); }
  if (orig.width !== W || orig.height !== H) return fg;
  x.clearRect(0, 0, W, H); x.drawImage(orig, 0, 0, W, H);
  const o = x.getImageData(0, 0, W, H).data;

  // Color de fondo = mediana de los píxeles fuera de la máscara
  const hr = new Uint32Array(256), hg = new Uint32Array(256), hb = new Uint32Array(256);
  let n = 0;
  for (let i = 0; i < p.length; i += 4 * 7) if (p[i + 3] < 8) { hr[o[i]]++; hg[o[i + 1]]++; hb[o[i + 2]]++; n++; }
  if (n < 500) return fg;
  const med = h => { let a = 0; for (let v = 0; v < 256; v++) { a += h[v]; if (a >= n / 2) return v; } return 0; };
  const B = [med(hr), med(hg), med(hb)];

  // Distancia al fondo: p85 dentro de la prenda = opaco
  const hd = new Uint32Array(443); let m = 0;
  for (let i = 0; i < p.length; i += 4 * 3) if (p[i + 3] > 230) {
    hd[Math.round(Math.hypot(p[i] - B[0], p[i + 1] - B[1], p[i + 2] - B[2]))]++; m++;
  }
  if (m < 500) return fg;
  let acc = 0, t1 = 442;
  for (let v = 0; v < 443; v++) { acc += hd[v]; if (acc >= m * 0.85) { t1 = v; break; } }
  if (t1 < 60) return fg; // prenda muy parecida al fondo: no tocar
  const t0 = t1 * 0.15;

  for (let i = 0; i < p.length; i += 4) {
    const a = p[i + 3]; if (!a) continue;
    const r = p[i], g = p[i + 1], b = p[i + 2];
    const k = Math.min(1, Math.max(0, (Math.hypot(r - B[0], g - B[1], b - B[2]) - t0) / (t1 - t0)));
    if (k >= 1) continue;
    const na = a / 255 * k;
    if (na < 0.004) { p[i + 3] = 0; continue; }
    p[i] = B[0] + (r - B[0]) / k; p[i + 1] = B[1] + (g - B[1]) / k; p[i + 2] = B[2] + (b - B[2]) / k;
    p[i + 3] = na * 255;
  }
  x.putImageData(fd, 0, 0);
  orig.close?.(); fg.close?.();
  return c.transferToImageBitmap();
}

$('#zip').onclick = async () => {
  const btn = $('#zip'); btn.disabled = true; btn.textContent = 'Armando zip…';
  const zip = new JSZip();
  const used = {};
  for (const { name, blob } of results){
    let n = name; if (used[n]) n = n.replace('.jpg', `_${used[n]}.jpg`); used[name] = (used[name] || 0) + 1;
    zip.file(n, blob);
  }
  const out = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(out); a.download = 'fotos_sabanas.zip'; a.click();
  btn.textContent = 'Descargar todas (.zip)'; btn.disabled = false;
};

$('#clear').onclick = () => {
  if (busy) queue.length = 0;
  grid.innerHTML = ''; results.length = 0; total = done = 0;
  $('#clear').disabled = true; updateStatus();
};
</script>
</body>
</html>
